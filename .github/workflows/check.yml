# The check every pull request into main runs: the same lint, formatting and build as
# npm run lint, npx prettier --check . and npm run build on your computer. Protecting main
# can require it to pass before a pull request merges. It never runs on a push to main.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Each action is pinned to one exact commit, like a lockfile pins a package.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npx prettier --check .
      - name: Build
        run: npm run build
